# Issue-to-Agent Routing Table
# Auto-suggest the right agent based on issue labels or title patterns.
# Used by the orchestrator to quickly route incoming issues.
#
# Also defines model tier routing per agent — dispatch.sh reads model_routing
# to pick the right Claude tier for each role.
#
# Lean roster (refactor/lean-roster, 2026-06): 20 active roles under roles/.
# Niche / redundant reviewers are in roles/_archived/. See that README to
# reactivate. Live seats always win: if prose docs disagree with this file
# or workers.yaml, **this config wins**.

# Model routing per agent role (passed as AGENT_MODEL → launcher --model).
# Claude accepts tier aliases (opus/sonnet/haiku) OR full IDs (e.g. claude-fable-5).
# Kimi launcher IGNORES opus/sonnet/haiku and uses the CLI default (Kimi K3).
# Grok launcher: same — tier aliases are not Claude models; leave default unless pinning.
#
# Owner multi-vendor defaults:
#   Claude docs/design  → claude-fable-5 (Fable 5)
#   Kimi producers      → provider kimi + CLI default = K3
#   Grok plan-critic    → provider grok (see workers.yaml)
#
# Quality-first value policy (owner 2026-07-28):
#   Optimize for output quality and leverage, not raw token thrift.
#   Best value still prefers producer sonnet × critic opus (heterogeneous pair)
#   for code implementation — the critic is the expensive judgment seat.
#   Use opus on producers when mistakes are hard to reverse or the seat IS
#   the judgment (DB migrations, contracts, test-first, infra, gates).
#
# Owner decision 2026-09-12: every Claude seat runs the flagship, claude-fable-5-1,
# producers and critics alike. Tier aliases are no longer used for fleet seats.
# Haiku is never used for development seats. Kimi and Grok seats are unchanged
# (workers.yaml provider_preferences picks the vendor; those launchers ignore
# this column). Cross-vendor pairs (kimi producer x claude critic, grok plan-critic)
# remain the source of independent error detection; same-model Claude pairs are
# accepted by the owner for now.
model_routing:
  # Gates / strategy / investigation
  orchestrator:              claude-fable-5-1
  cto:                       claude-fable-5-1
  retro:                     claude-fable-5-1
  security-reviewer:         claude-fable-5-1
  investigate:               claude-fable-5-1

  # Critics — adversarial review (always opus)
  backend-critic:            claude-fable-5-1
  frontend-critic:           claude-fable-5-1
  database-critic:           claude-fable-5-1
  api-critic:                claude-fable-5-1

  # Producers where quality = best value at sonnet + opus critic
  go-backend:                claude-fable-5-1
  web-frontend:              claude-fable-5-1   # ignored when provider=kimi → K3
  mobile:                    claude-fable-5-1

  # Producers / specialists where mistakes are expensive → opus
  db-architect:              claude-fable-5-1     # irreversible migrations (DB exception)
  api-designer:              claude-fable-5-1     # OpenAPI contract is product law
  devops:                    claude-fable-5-1     # CI/deploy/infra blast radius
  test-engineer:             claude-fable-5-1     # test-first quality bar before producers

  # High-volume mechanical routing (not code review)
  pr-sentinel:               claude-fable-5-1

  # Claude Fable 5 — docs / design proposals
  docs-writer:               claude-fable-5-1

  # plan-critic is Grok (workers.yaml); no Claude model pin
  # plan-critic:             (omit — vendor default)
  # devops-critic is Grok (workers.yaml); tier aliases are meaningless to grok
  # and kimi, so no pin here: the launcher uses the vendor default.
  # devops-critic:           (omit, vendor default)

  default:                   claude-fable-5-1

# Label-based routing: exact match on GitHub issue labels
label_routes:
  "agent:go-backend": go-backend
  "agent:web-frontend": web-frontend
  "agent:db-architect": db-architect
  "agent:test-engineer": test-engineer
  "agent:devops": devops
  "agent:api-designer": api-designer
  "agent:security-reviewer": security-reviewer
  "migration": db-architect
  "security": security-reviewer
  "documentation": docs-writer
  "bug": investigate
  "investigate": investigate
  "incident": investigate
  "flaky": investigate
  # Critic review labels (the surviving review system)
  "review:backend": backend-critic
  "review:frontend": frontend-critic
  "review:database": database-critic
  "review:api": api-critic
  "review:security": security-reviewer

# Title pattern routing: regex match on issue title (first match wins)
title_patterns:
  "^fix:.*test": test-engineer
  "^docs:": docs-writer
  "^feat:.*api": api-designer
  "^bug:": investigate
  "^debug:": investigate
  "^fix:.*flaky": investigate

# Per-role provider failover chains (walked by dispatch.sh when the earlier
# provider is rate-capped/cooling — exit 75 — or unavailable — exit 69).
# Resolution: [provider_preferences from workers.yaml] + chain, deduplicated.
provider_failover:
  web-frontend: [kimi, claude]
  # plan-critic never fails over: autoplan.sh Pass 4 calls
  # providers/grok/plan-critic.sh directly and treats an absent/logged-out grok
  # as a clean skip (exit 3). Listing claude here was dead config, and under the
  # vendor-ownership rule it would make sync-providers.sh create a Claude seat
  # for a charter pinned to model: grok, which Claude cannot resolve.
  plan-critic: [grok]
  # devops-critic stays non-Anthropic on failover. Falling back to claude would
  # pair it with devops (claude/opus) on the same vendor AND the same tier,
  # which is the exact same-seat pairing this role exists to prevent.
  devops-critic: [grok, kimi]
  default: [claude, kimi]

# Rate-cap sentinel: a vendor that emits a ratecap pattern (config/
# ratecap-patterns.conf) is marked cooling for this window and skipped by
# resolve_provider until it expires.
rate_caps:
  cooldown_minutes: 60
