# Issue-to-Agent Routing Table
# Auto-suggest the right agent based on issue labels or title patterns.
# Used by the orchestrator to quickly route incoming issues.
#
# Also defines model tier routing per agent — dispatch.sh reads model_routing
# to pick the right Claude tier for each role.
#
# Lean roster (refactor/lean-roster, 2026-06): 18 active roles. The redundant
# "reviewer" layer and niche meta-roles were archived to roles/_archived/.
# Their review coverage folds into the 4 Critics + Security + CTO gate.
# See roles/_archived/README.md to reactivate any of them.

# Model routing per agent role (passed as AGENT_MODEL → launcher --model).
# Claude accepts tier aliases (opus/sonnet/haiku) OR full IDs (e.g. claude-fable-5).
# Kimi launcher IGNORES opus/sonnet/haiku and uses the CLI default (Kimi K3).
# Grok launcher: same — tier aliases are not Claude models; leave default unless pinning.
#
# Owner multi-vendor defaults (do not "optimize" without asking):
#   Claude docs/design  → claude-fable-5 (Fable 5)
#   Kimi producers      → provider kimi + CLI default = K3
#   Grok plan-critic    → provider grok (see workers.yaml)
#
# Tier guidance (Claude only):
#   claude-fable-5 — owner flagship for design/docs (above opus)
#   opus           — strategic/judgment-heavy: planning, adversarial critique, gate
#   sonnet         — implementation and routine work (default for Claude dev work)
#   haiku          — lightweight, mechanical, or high-volume tasks
model_routing:
  # High-reasoning roles — Claude flagship tier alias
  orchestrator:              opus
  cto:                       opus
  retro:                     opus
  security-reviewer:         opus
  investigate:               opus

  # Critics — adversarial review (Claude seats)
  backend-critic:            opus
  frontend-critic:           opus
  database-critic:           opus
  api-critic:                opus

  # Implementation roles — Claude sonnet; web-frontend is Kimi so sonnet is ignored → K3
  go-backend:                sonnet
  web-frontend:              sonnet
  mobile:                    sonnet
  db-architect:              sonnet
  api-designer:              sonnet
  devops:                    sonnet
  test-engineer:             sonnet

  # Claude Fable 5 — owner default for docs / design proposals
  docs-writer:               claude-fable-5

  # plan-critic is Grok (workers.yaml); no Claude model pin
  # plan-critic:             (omit — vendor default)

  # Default when a role isn't listed above
  default:                   sonnet

# Label-based routing: exact match on GitHub issue labels
label_routes:
  "agent:go-backend": go-backend
  "agent:web-frontend": web-frontend
  "agent:db-architect": db-architect
  "agent:test-engineer": test-engineer
  "agent:devops": devops
  "agent:api-designer": api-designer
  "agent:security-reviewer": security-reviewer
  "migration": db-architect
  "security": security-reviewer
  "documentation": docs-writer
  "bug": investigate
  "investigate": investigate
  "incident": investigate
  "flaky": investigate
  # Critic review labels (the surviving review system)
  "review:backend": backend-critic
  "review:frontend": frontend-critic
  "review:database": database-critic
  "review:api": api-critic
  "review:security": security-reviewer

# Title pattern routing: regex match on issue title (first match wins)
title_patterns:
  "^fix:.*test": test-engineer
  "^docs:": docs-writer
  "^feat:.*api": api-designer
  "^bug:": investigate
  "^debug:": investigate
  "^fix:.*flaky": investigate

# Per-role provider failover chains (walked by dispatch.sh when the earlier
# provider is rate-capped/cooling — exit 75 — or unavailable — exit 69).
# Resolution: [provider_preferences from workers.yaml] + chain, deduplicated.
provider_failover:
  web-frontend: [kimi, claude]
  plan-critic: [grok, claude]
  default: [claude, kimi]

# Rate-cap sentinel: a vendor that emits a ratecap pattern (config/
# ratecap-patterns.conf) is marked cooling for this window and skipped by
# resolve_provider until it expires.
rate_caps:
  cooldown_minutes: 60
