# Rate-cap / auth / provider-limit detection patterns per vendor CLI.
# Format: vendor|class|extended-regex   (class: ratecap | auth | limit)
# Matched case-insensitively against the LAST 25 LINES of agent output only —
# cap/auth messages appear at the end of a run; agents may legitimately
# *discuss* rate limits mid-transcript.
# limit rows come first: the limit class also has to pass the structural gate
# in providers/lib.sh (fast exit, no API time, an error), and a match that
# fails the gate falls through to the rows below, so a slow 401 stays a plain
# auth failure.
# STARTING VALUES — tune from real events in logs/provider-state/ratecap.log.

claude|limit|spend limit
claude|limit|session limit resets
claude|limit|HTTP.*401
claude|ratecap|usage limit reached
claude|ratecap|reached your (usage|session) limit
claude|ratecap|5-hour limit
claude|ratecap|limit resets at
claude|auth|please run /login
claude|auth|not logged in
claude|auth|oauth session expired
claude|auth|failed to authenticate
claude|auth|could not be refreshed

kimi|limit|spend limit
kimi|limit|session limit
kimi|limit|HTTP.*401
kimi|ratecap|HTTP.*429
kimi|ratecap|status.*429
kimi|ratecap|too many requests
kimi|ratecap|rate.?limit.*(exceeded|reached|hit)
kimi|ratecap|quota.*(exceeded|exhausted|insufficient)
kimi|auth|not logged in
kimi|auth|kimi login
kimi|auth|HTTP.*401
kimi|auth|unauthorized

grok|limit|spend limit
grok|limit|session limit
grok|limit|HTTP.*401
grok|ratecap|HTTP.*429
grok|ratecap|too many requests
grok|ratecap|rate.?limit.*(exceeded|reached|hit)
grok|ratecap|quota.*(exceeded|exhausted)
grok|ratecap|usage cap
grok|auth|not (logged in|authenticated)
grok|auth|grok login
grok|auth|HTTP.*401
grok|auth|unauthorized
