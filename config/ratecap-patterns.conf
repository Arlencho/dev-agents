# Rate-cap / auth / provider-limit detection patterns per vendor CLI.
# Format: vendor|class|extended-regex   (class: ratecap | auth | limit)
# Matched only against CLI diagnostics and structured API errors.
# Paid credit errors (402, Payment Required, usage balance exhausted) are
# vendor-independent and classified first in providers/lib.sh.
# limit rows come first: the limit class also has to pass the structural gate
# in providers/lib.sh (fast exit, no API time, an error), and a match that
# fails the gate falls through to the rows below, so a slow 401 stays a plain
# auth failure.
# STARTING VALUES — tune from real events in logs/provider-state/ratecap.log.

claude|limit|spend limit
claude|limit|session limit resets
claude|limit|HTTP.*401
claude|ratecap|usage limit reached
claude|ratecap|reached your (usage|session) limit
claude|ratecap|5-hour limit
claude|ratecap|limit resets at
claude|auth|please run /login
claude|auth|not logged in
claude|auth|oauth session expired
claude|auth|failed to authenticate
claude|auth|could not be refreshed

kimi|limit|spend limit
kimi|limit|session limit
kimi|limit|HTTP.*401
kimi|ratecap|HTTP.*429
kimi|ratecap|status.*429
kimi|ratecap|too many requests
kimi|ratecap|rate.?limit.*(exceeded|reached|hit)
kimi|ratecap|quota.*(exceeded|exhausted|insufficient)
kimi|ratecap|reached your (weekly|7-day|daily|usage)
kimi|ratecap|(weekly|7-day).*usage limit
kimi|ratecap|HTTP.*403.*usage limit
kimi|auth|not logged in
kimi|auth|kimi login
kimi|auth|HTTP.*401
kimi|auth|unauthorized

grok|limit|spend limit
grok|limit|session limit
grok|limit|HTTP.*401
grok|ratecap|HTTP.*429
grok|ratecap|too many requests
grok|ratecap|rate.?limit.*(exceeded|reached|hit)
grok|ratecap|quota.*(exceeded|exhausted)
grok|ratecap|usage cap
grok|auth|not (logged in|authenticated)
grok|auth|grok login
grok|auth|HTTP.*401
grok|auth|unauthorized

# codex: the CLI prints its own limit line ("You've hit your usage limit ...
# try again at <time>") plus the API error codes (usage_limit_reached,
# rate_limit_exceeded, insufficient_quota) and plain HTTP statuses.
codex|limit|spend limit
codex|limit|session limit
codex|limit|HTTP.*401
codex|ratecap|HTTP.*429
codex|ratecap|status.*429
codex|ratecap|too many requests
codex|ratecap|rate.?limit.*(exceeded|reached|hit)
codex|ratecap|rate_limit_exceeded
codex|ratecap|quota.*(exceeded|exhausted|insufficient)
codex|ratecap|insufficient_quota
codex|ratecap|(hit|reached) (your|the) usage limit
codex|ratecap|usage.?limit.*(reached|exceeded|hit)
codex|ratecap|usage_limit_reached
codex|ratecap|usage balance
codex|ratecap|(insufficient|out of|no remaining) credits
codex|ratecap|402 Payment Required
codex|auth|not logged in
codex|auth|codex login
codex|auth|HTTP.*401
codex|auth|unauthorized
codex|auth|(token|session) (has )?expired
codex|auth|refresh.*token.*(failed|invalid|expired)

grok|ratecap|usage balance exhausted
grok|ratecap|402 Payment Required
grok|ratecap|usage limit
grok|ratecap|quota will reset

kimi|ratecap|usage balance exhausted
kimi|ratecap|402 Payment Required
kimi|ratecap|usage limit
kimi|ratecap|quota will reset

claude|ratecap|HTTP.*429
claude|ratecap|too many requests
