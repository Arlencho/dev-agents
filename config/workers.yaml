# Worker Machine Registry
# Edit this file with your Mac Mini details after running setup-machine.sh on each.
# The orchestrator and dispatch.sh read this to know where to send work.

# Provider preference per agent role — PRIMARY provider only.
# dispatch.sh reads this to select the CLI tool (claude | kimi | grok),
# then walks provider_failover in routing.yaml when the primary is
# rate-capped (exit 75) or unavailable (exit 69).
#
# Owner multi-vendor seats (pair with routing.yaml model_routing):
#   docs-writer   → claude + claude-fable-5
#   web-frontend  → kimi   + K3 (CLI default)
#   plan-critic   → grok   + CLI default
#   devops-critic → grok   + CLI default (failover kimi, stays non-Anthropic)
# Quality-first Claude tiers live in routing.yaml (2026-07-28).
# NOTE: YAML parsers here don't strip inline comments — keep values bare.
provider_preferences:
  # Producers
  go-backend: claude
  web-frontend: kimi
  db-architect: claude
  api-designer: claude
  devops: claude
  test-engineer: claude
  mobile: claude
  # Critics + gate
  backend-critic: claude
  frontend-critic: claude
  database-critic: claude
  api-critic: claude
  plan-critic: grok
  devops-critic: grok
  security-reviewer: claude
  cto: claude
  # Meta / ops
  orchestrator: claude
  investigate: claude
  docs-writer: claude
  retro: claude
  default: claude

machines:
  # Your command center — runs orchestrator, reviews PRs, merges
  - name: macbook-pro
    host: localhost
    role: orchestrator
    max_agents: 6
    notes: "Primary machine. Orchestrator + security-reviewer + tech-scout"

  # Same physical machine as a dispatch target — get_workers() only returns
  # role: worker entries, so single-machine setups need this alongside the
  # orchestrator entry. Remove once real mac-mini workers come online.
  - name: macbook-pro-local
    host: localhost
    role: worker
    max_agents: 3

  # Worker 1 — backend-focused
  # Uncomment and fill in after running setup-machine.sh on Mac Mini 1
  # - name: mac-mini-1
  #   host: mac-mini-1            # must match ~/.ssh/config Host entry
  #   role: worker
  #   max_agents: 4
  #   preferred_agents:
  #     - go-backend
  #     - db-architect
  #     - api-designer
  #     - devops
  #   notes: "Backend work"

  # Worker 2 — frontend-focused
  # Uncomment and fill in after running setup-machine.sh on Mac Mini 2
  # - name: mac-mini-2
  #   host: mac-mini-2            # must match ~/.ssh/config Host entry
  #   role: worker
  #   max_agents: 4
  #   preferred_agents:
  #     - web-frontend
  #     - mobile
  #     - seo-auditor
  #     - test-engineer
  #   notes: "Frontend + mobile work"
